<!doctype html>
<meta charset="utf-8">
<!-- 已装模组：从版本详情点进来，单独一页，列表自己滚动（不显示滚动条）。 -->
<style>
  :root{
    --surface:#f9f9ff; --low:#f3f3fa; --lowest:#fff; --cont:#ededf4; --high:#e7e8ee;
    --on:#191c20; --on-var:#44474e; --outline:#74777f; --outline-var:#c4c6d0;
    --primary:#415f91; --on-primary:#fff;
    --p-cont:#d6e3ff; --on-p-cont:#001b3e;
    --s-cont:#dae2f9; --on-s-cont:#131c2b;
    --ok:#146c2e; --err:#ba1a1a; --e-cont:#ffdad6;
    --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Noto Sans SC",system-ui,sans-serif;
    --e1:0 1px 2px rgba(16,24,40,.06);
    --ease-std:cubic-bezier(.2,0,0,1);
    --d-short:120ms; --d-med:220ms;
  }
  *{box-sizing:border-box}
  html,body{height:100%; overflow:hidden}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  body{
    margin:0; padding:18px 20px 14px; background:var(--low); color:var(--on);
    font:400 14px/20px var(--font); color-scheme:light; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:0;
  }
  .top{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex:0 0 auto}
  h1{margin:0; font:400 22px/28px "Segoe UI Variable Display",var(--font)}
  button{
    background:transparent; color:var(--on); border:1px solid var(--outline-var);
    border-radius:10px; height:34px; padding:0 14px; font:500 13px var(--font); cursor:pointer;
    transition:background var(--d-short) var(--ease-std), transform var(--d-short) var(--ease-std);
  }
  button:hover:not(:disabled){background:var(--high)}
  button:active:not(:disabled){transform:scale(.97)}
  button.primary{background:var(--primary); color:var(--on-primary); border-color:transparent}
  button.danger{color:var(--err); border-color:var(--e-cont)}
  button.danger:hover:not(:disabled){background:var(--e-cont)}
  button:disabled{opacity:.45; cursor:default; transform:none}
  .back{border-color:transparent; background:none; color:var(--on-var); height:32px; padding:0 10px; font-size:12.5px}
  .back:hover{background:var(--high); color:var(--on)}
  .chipmini{
    height:24px; padding:0 10px; border-radius:12px; background:var(--cont);
    color:var(--on-var); font-size:12px; line-height:24px; white-space:nowrap;
  }
  .chipmini.hl{background:var(--s-cont); color:var(--on-s-cont)}
  .bar{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex:0 0 auto}
  input[type=text]{
    flex:1 1 auto; min-width:0; height:36px; padding:0 12px; border-radius:10px;
    border:1px solid var(--outline-var); background:var(--lowest); color:var(--on);
    font:inherit; outline:none;
  }
  input[type=text]:focus{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary)}
  .count{color:var(--on-var); font-size:12.5px; flex:0 0 auto}
  /* 列表自己滚，滚动条藏起来：鼠标滚轮 / 触控板照常。 */
  .scroll{
    flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    scrollbar-width:none; -ms-overflow-style:none;
    background:var(--lowest); border-radius:14px; box-shadow:var(--e1); padding:8px;
  }
  .scroll::-webkit-scrollbar{width:0; height:0; display:none}
  .mrow{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer}
  .mrow + .mrow{margin-top:2px}
  .mrow:hover{background:var(--low)}
  .ico{
    width:32px; height:32px; border-radius:8px; flex:0 0 auto; object-fit:cover;
    background:var(--cont); display:flex; align-items:center; justify-content:center;
    font:600 13px var(--font); color:var(--on-var); overflow:hidden;
  }
  .ico img{width:100%; height:100%; object-fit:cover; display:block}
  .mrow .nm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px}
  .mrow .sz{color:var(--on-var); font-size:12px; flex:0 0 auto}
  .mrow.off .nm{color:var(--on-var); text-decoration:line-through}
  .mrow button{height:28px; padding:0 10px; font-size:12.5px; flex:0 0 auto}
  .upd{font-size:11px; color:var(--primary); background:var(--p-cont); border-radius:6px; padding:1px 6px; flex:0 0 auto}
  .empty{color:var(--on-var); font-size:12.5px; padding:10px 4px}
  .status{
    margin-top:10px; display:flex; align-items:center; gap:8px; padding:10px 14px; flex:0 0 auto;
    background:var(--lowest); border-radius:14px; box-shadow:var(--e1); color:var(--on-var); font-size:12.5px;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--outline); flex:0 0 auto}
  .dot.busy{background:var(--primary); animation:pulse 1.1s infinite}
  .dot.on{background:var(--ok)}
  .dot.bad{background:var(--err)}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.3}}

  /* 模组详情弹窗 */
  .mask{position:fixed; inset:0; background:rgba(25,28,32,.32); display:flex;
    align-items:center; justify-content:center; z-index:60; animation:fadeIn 120ms var(--ease-std)}
  .sheet{width:min(520px, 90vw); max-height:82vh; overflow:auto; scrollbar-width:none;
    background:var(--lowest); border-radius:18px; padding:20px 22px 16px;
    box-shadow:0 18px 48px rgba(25,28,32,.24)}
  .sheet::-webkit-scrollbar{width:0}
  .sheet .head{display:flex; gap:14px; align-items:flex-start; margin-bottom:12px}
  .sheet .big{width:56px; height:56px; border-radius:12px; flex:0 0 auto; background:var(--cont);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    font:600 20px var(--font); color:var(--on-var)}
  .sheet .big img{width:100%; height:100%; object-fit:cover}
  .sheet h3{margin:0 0 4px; font:600 16px/22px var(--font)}
  .sheet .sub{color:var(--on-var); font-size:12.5px}
  .sheet p{margin:0 0 14px; color:var(--on-var); font-size:13px; line-height:20px}
  .sheet .acts{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end}
</style>

<div class="top">
  <button class="back" id="back">← 返回</button>
  <h1>已装模组</h1>
  <span class="chipmini" id="ver"></span>
  <span class="chipmini hl" id="updchip" hidden></span>
</div>

<div class="bar">
  <input type="text" id="q" placeholder="搜索模组" spellcheck="false">
  <span class="count" id="count"></span>
  <button id="dlmods">下载模组</button>
  <button id="refresh">刷新</button>
</div>

<div class="scroll" id="list"><div class="empty">正在读取…</div></div>

<div class="status"><span class="dot" id="dot"></span><span id="status">正在读取模组列表…</span></div>

<script>
  const $ = s => document.querySelector(s);
  let name = "";
  let items = [];
  let metas = {};     // file -> { title, desc, icon, project, version }
  let updates = {};   // file -> { latest, vid, title }
  let info = null;

  function log(msg, kind) {
    $("#status").textContent = msg || "";
    $("#dot").className = "dot" + (kind ? " " + kind : "");
  }

  function query() {
    const raw = window.__MiyQuery || "";
    const m = /(?:^|&)name=([^&]*)/.exec(raw);
    if (!m) return "";
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }

  function titleOf(m) {
    const meta = metas[m.file];
    return (meta && meta.title) || m.file.replace(/\.jar(\.disabled)?$/, "");
  }

  function iconEl(m, cls) {
    const box = document.createElement("div");
    box.className = cls;
    const meta = metas[m.file];
    if (meta && meta.icon) {
      const img = document.createElement("img");
      img.src = meta.icon;
      img.alt = "";
      img.onerror = () => { img.remove(); box.textContent = (titleOf(m) || "?").slice(0, 1).toUpperCase(); };
      box.appendChild(img);
    } else {
      box.textContent = (titleOf(m) || "?").slice(0, 1).toUpperCase();
    }
    return box;
  }

  function render() {
    const q = ($("#q").value || "").trim().toLowerCase();
    const list = items.filter(m => {
      if (!q) return true;
      const t = titleOf(m).toLowerCase();
      return (m.file || "").toLowerCase().includes(q) || t.includes(q);
    });
    $("#count").textContent = q
      ? list.length + " / " + items.length
      : (items.length ? String(items.length) : "");
    const box = $("#list");
    if (!list.length) {
      box.replaceChildren();
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = items.length ? "没有匹配的模组。" : "这个版本的 mods 文件夹还是空的。";
      box.appendChild(d);
      return;
    }
    box.replaceChildren(...list.map(m => {
      const row = document.createElement("div");
      row.className = "mrow" + (m.disabled ? " off" : "");
      row.append(iconEl(m, "ico"));
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = titleOf(m);
      nm.title = m.file;
      const sz = document.createElement("span");
      sz.className = "sz";
      sz.textContent = m.size ? (m.size / 1048576).toFixed(1) + " MB" : "";
      row.append(nm, sz);
      const up = updates[m.file];
      if (up) {
        const tag = document.createElement("span");
        tag.className = "upd";
        tag.textContent = "可更新";
        tag.title = "当前 " + (up.current || "") + "，最新 " + (up.latest || "");
        row.append(tag);
      }
      const btn = document.createElement("button");
      btn.textContent = m.disabled ? "启用" : "禁用";
      btn.onclick = async e => {
        e.stopPropagation();
        btn.disabled = true;
        try {
          await miy.call("miy.mc.modtoggle", { id: name, file: m.file, enable: !!m.disabled }, 8000);
          m.disabled = !m.disabled;
          render();
          log(m.disabled ? "已禁用 " + titleOf(m) + "，下次启动生效。" : "已启用 " + titleOf(m) + "，下次启动生效。", "on");
        } catch (err) {
          log("改不了这个模组的状态，请确认游戏没有在运行。", "bad");
          btn.disabled = false;
        }
      };
      row.append(btn);
      // 删除就放在禁用旁边：删一个模组不该先点开详情。
      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = "删除";
      let armed = 0;
      del.onclick = async e => {
        e.stopPropagation();
        if (!armed) {
          armed = setTimeout(() => { armed = 0; del.textContent = "删除"; }, 3000);
          del.textContent = "再点一次";
          return;
        }
        clearTimeout(armed);
        armed = 0;
        del.disabled = true;
        try {
          await miy.call("miy.mc.modremove", { id: name, file: m.file }, 15000);
          await loadFiles();
          log("已删除 " + titleOf(m) + "。", "on");
        } catch (err) {
          del.disabled = false;
          del.textContent = "删除";
          log("删除失败，请确认游戏没有在运行。", "bad");
        }
      };
      row.append(del);
      row.onclick = () => openSheet(m);
      return row;
    }));
  }

  /* 模组详情：图标、简介、版本，以及删除 / 打开文件夹 / 启用禁用 / 更新。 */
  function openSheet(m) {
    const meta = metas[m.file] || {};
    const mask = document.createElement("div");
    mask.className = "mask";
    const sheet = document.createElement("div");
    sheet.className = "sheet";

    const head = document.createElement("div");
    head.className = "head";
    head.append(iconEl(m, "big"));
    const titles = document.createElement("div");
    const h = document.createElement("h3");
    h.textContent = titleOf(m);
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = [
      meta.version ? "版本 " + meta.version : "",
      m.disabled ? "已禁用" : "已启用",
      m.size ? (m.size / 1048576).toFixed(1) + " MB" : "",
    ].filter(Boolean).join(" · ");
    titles.append(h, sub);
    head.append(titles);
    sheet.append(head);

    const p = document.createElement("p");
    p.textContent = meta.desc || "这个模组没有可显示的简介。";
    sheet.append(p);

    const fileLine = document.createElement("p");
    fileLine.className = "sub";
    fileLine.style.marginBottom = "14px";
    fileLine.textContent = m.file;
    sheet.append(fileLine);

    const acts = document.createElement("div");
    acts.className = "acts";

    const close = document.createElement("button");
    close.textContent = "关闭";
    close.onclick = () => mask.remove();

    const folder = document.createElement("button");
    folder.textContent = "打开文件夹";
    folder.onclick = () => {
      miy.call("miy.mc.folder", { id: name, kind: "mods" }, 15000)
        .catch(() => log("没能打开模组文件夹。", "bad"));
    };

    const toggle = document.createElement("button");
    toggle.textContent = m.disabled ? "启用" : "禁用";
    toggle.onclick = async () => {
      toggle.disabled = true;
      try {
        await miy.call("miy.mc.modtoggle", { id: name, file: m.file, enable: !!m.disabled }, 8000);
        m.disabled = !m.disabled;
        mask.remove();
        render();
        log(m.disabled ? "已禁用 " + titleOf(m) + "。" : "已启用 " + titleOf(m) + "。", "on");
      } catch (e) {
        toggle.disabled = false;
        log("改不了这个模组的状态。", "bad");
      }
    };

    const up = updates[m.file];
    if (up) {
      const ub = document.createElement("button");
      ub.className = "primary";
      ub.textContent = "更新到 " + (up.latest || "最新版");
      ub.onclick = async () => {
        ub.disabled = true;
        ub.textContent = "更新中…";
        try {
          await miy.call("miy.mc.modupdate", { id: name, file: m.file, vid: up.vid }, 600000);
          delete updates[m.file];
          mask.remove();
          await loadFiles();
          log("已更新 " + titleOf(m) + "。", "on");
        } catch (e) {
          ub.disabled = false;
          ub.textContent = "更新";
          log("更新失败，请稍后重试。", "bad");
        }
      };
      acts.append(ub);
    }

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "删除模组";
    del.onclick = async () => {
      del.disabled = true;
      try {
        await miy.call("miy.mc.modremove", { id: name, file: m.file }, 15000);
        mask.remove();
        await loadFiles();
        log("已删除 " + titleOf(m) + "。", "on");
      } catch (e) {
        del.disabled = false;
        log("删除失败，请确认游戏没有在运行。", "bad");
      }
    };

    acts.append(folder, toggle, del, close);
    sheet.append(acts);
    mask.append(sheet);
    mask.onclick = e => { if (e.target === mask) mask.remove(); };
    document.body.append(mask);
  }

  async function loadFiles() {
    try {
      const r = await miy.call("miy.mc.modfiles", { id: name }, 15000);
      items = (r && r.items) || [];
    } catch (e) { items = []; }
    render();
    loadIcons();
  }

  /* 图标要联网查，慢；先画列表，图标回来了再补。 */
  async function loadIcons() {
    if (!name || !items.length) return;
    try {
      const r = await miy.call("miy.mc.modicons", { id: name }, 120000);
      metas = {};
      for (const it of (r && r.items) || []) {
        if (it && it.meta && it.meta.title) metas[it.file] = it.meta;
      }
      render();
    } catch (e) { /* 静默：没有图标也能用 */ }
  }

  /* 更新检查放后台：先把列表画出来，网络结果回来了再补「可更新」标记。 */
  async function checkUpdatesQuiet() {
    if (!name) return;
    try {
      const r = await miy.call("miy.mc.modupdates", {
        id: name,
        mc: (info && info.mc) || "",
        loader: (info && info.loader) || "",
      }, 120000);
      updates = {};
      for (const u of (r && r.updates) || []) updates[u.file] = u;
      const n = Object.keys(updates).length;
      const chip = $("#updchip");
      chip.hidden = n === 0;
      chip.textContent = n ? n + " 个可更新" : "";
      render();
      if (n) log("有 " + n + " 个模组可以更新。", "on");
    } catch (e) { /* 静默：查不到更新不该打扰用户 */ }
  }

  async function loadInfo() {
    try {
      // 只问这一个版本，别去扫全部版本 —— 那是几秒钟的活。
      const r = await miy.call("miy.mc.verinfo", { id: name }, 8000);
      info = (r && r.ok) ? r : null;
      $("#ver").textContent = name;
    } catch (e) { /* 忽略 */ }
  }

  $("#back").onclick = () => miy.goto("page:miy.mc/detail?name=" + encodeURIComponent(name));
  // 带着版本名跳过去：模组页会把这个版本设成安装目标，并按它的 MC 版本筛选。
  $("#dlmods").onclick = () => miy.goto("page:miy.mc/mods?name=" + encodeURIComponent(name));
  $("#q").addEventListener("input", render);
  $("#refresh").onclick = async () => {
    const b = $("#refresh");
    b.disabled = true;
    await loadFiles();
    b.disabled = false;
    checkUpdatesQuiet();
  };

  name = query();
  if (!name) {
    log("没有指定版本。", "bad");
  } else {
    (async () => {
      // 列表和版本信息并行取，谁先回来先画谁。
      await Promise.all([loadInfo(), loadFiles()]);
      log(items.length ? "共 " + items.length + " 个模组。" : "这个版本还没有装模组。", items.length ? "on" : "");
      checkUpdatesQuiet();
    })();
  }
</script>
