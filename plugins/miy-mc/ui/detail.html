<!doctype html>
<meta charset="utf-8">
<!-- 版本详情：概览 / 高级选项 / 模组 / 导出 四个分区，顶部切换。 -->
<style>
  :root{
    --surface:#f9f9ff; --low:#f3f3fa; --lowest:#fff; --cont:#ededf4; --high:#e7e8ee;
    --on:#191c20; --on-var:#44474e; --outline:#74777f; --outline-var:#c4c6d0;
    --primary:#415f91; --on-primary:#fff;
    --p-cont:#d6e3ff; --on-p-cont:#001b3e;
    --s-cont:#dae2f9; --on-s-cont:#131c2b;
    --ok:#146c2e; --err:#ba1a1a; --e-cont:#ffdad6;
    --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Noto Sans SC",system-ui,sans-serif;
    --e1:0 1px 2px rgba(16,24,40,.06);
    --ease-std:cubic-bezier(.2,0,0,1);
    --d-short:120ms; --d-med:220ms;
  }
  *{box-sizing:border-box}
  html,body{height:100%; overflow:hidden}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  body{
    margin:0; padding:18px 20px 14px; background:var(--low); color:var(--on);
    font:400 14px/20px var(--font); color-scheme:light; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  .top{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  button{
    background:transparent; color:var(--on); border:1px solid var(--outline-var);
    border-radius:10px; height:38px; padding:0 16px; font:500 13px var(--font); cursor:pointer;
    transition:background var(--d-short) var(--ease-std), transform var(--d-short) var(--ease-std);
  }
  button:hover:not(:disabled){background:var(--high)}
  button:active:not(:disabled){transform:scale(.97)}
  button.primary{background:var(--primary); color:var(--on-primary); border-color:transparent}
  button.primary:hover:not(:disabled){box-shadow:0 2px 8px rgba(65,95,145,.26); background:var(--primary)}
  button.danger{color:var(--err); border-color:var(--e-cont)}
  button.danger:hover:not(:disabled){background:var(--e-cont)}
  button:disabled{opacity:.45; cursor:default; transform:none}
  .back{border-color:transparent; background:none; color:var(--on-var); height:32px; padding:0 10px; font-size:12.5px}
  .back:hover{background:var(--high); color:var(--on)}
  h1{margin:0; font:400 22px/28px "Segoe UI Variable Display",var(--font)}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto}
  .chipmini{
    height:24px; padding:0 10px; border-radius:12px; background:var(--cont);
    color:var(--on-var); font-size:12px; line-height:24px; white-space:nowrap;
  }
  .chipmini.hl{background:var(--s-cont); color:var(--on-s-cont)}
  .chipmini.warn{background:var(--e-cont); color:var(--err)}

  /* 顶部分区栏 */
  .tabs{display:flex; gap:4px; margin-bottom:12px; flex:0 0 auto}
  .tab{
    height:34px; padding:0 14px; border-radius:9px; border:none; background:transparent;
    color:var(--on-var); font:500 13px var(--font); cursor:pointer;
    transition:background var(--d-short) var(--ease-std), color var(--d-short) var(--ease-std);
  }
  .tab:hover{background:var(--high); color:var(--on)}
  .tab.on{background:var(--p-cont); color:var(--on-p-cont)}
  .pane{display:none; flex:1 1 auto; min-height:0; overflow:auto; scrollbar-width:none}
  .pane::-webkit-scrollbar{width:0; height:0}
  .pane.on{display:block; animation:fadeIn var(--d-med) var(--ease-std) both}

  .card{
    background:var(--lowest); border-radius:16px; box-shadow:var(--e1); padding:6px 4px;
    margin-bottom:14px;
  }
  .row{display:flex; align-items:center; gap:12px; padding:8px 14px}
  .row + .row{border-top:1px solid var(--high)}
  .k{width:96px; flex:0 0 auto; color:var(--on-var); font-size:13px}
  .v{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mono{font-family:Consolas,"Cascadia Mono",monospace; font-size:12.5px; color:var(--on-var)}
  input[type=text], textarea{
    flex:1 1 auto; min-width:0; padding:8px 12px; border-radius:8px;
    border:1px solid var(--outline-var); background:var(--lowest); color:var(--on);
    font:inherit; outline:none; transition:border-color var(--d-short) var(--ease-std);
  }
  input[type=text]{height:36px; padding:0 12px}
  textarea{resize:vertical; min-height:64px; font-family:Consolas,"Cascadia Mono",monospace; font-size:12.5px}
  input[type=text]:focus, textarea:focus{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary)}
  .acts{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .acts .spacer{flex:1 1 auto}
  .dirs{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  .dirs button{padding:0 12px; height:34px; font-size:13px; color:var(--on-var)}
  .memslider{display:flex; align-items:center; gap:10px; flex:1 1 auto; min-width:220px; margin-right:10px}
  .memslider .rail{position:relative; flex:1 1 auto; min-width:140px; height:20px; display:flex; align-items:center}
  .memslider .track{position:absolute; left:0; right:0; height:4px; border-radius:2px; background:var(--cont); overflow:hidden}
  .memslider .track i{display:block; height:100%; width:0; background:var(--primary)}
  .memslider input[type=range]{
    position:absolute; left:0; top:0; width:100%; height:20px; margin:0;
    appearance:none; background:transparent; outline:none; cursor:pointer;
  }
  .memslider input[type=range]::-webkit-slider-runnable-track{height:20px; background:transparent; border:none}
  .memslider input[type=range]::-webkit-slider-thumb{
    appearance:none; width:16px; height:16px; border-radius:50%; background:var(--primary);
    border:none; box-shadow:0 1px 3px rgba(0,0,0,.24); cursor:pointer;
  }
  .memslider .mono{min-width:64px; text-align:right; font-variant-numeric:tabular-nums}
  .empty{color:var(--on-var); font-size:12.5px; padding:6px 2px}
  .status{
    margin-top:auto; display:flex; align-items:center; gap:8px; padding:10px 14px;
    background:var(--lowest); border-radius:14px; box-shadow:var(--e1); color:var(--on-var); font-size:12.5px;
    flex:0 0 auto;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--outline); flex:0 0 auto}
  .dot.busy{background:var(--primary); animation:pulse 1.1s infinite}
  .dot.on{background:var(--ok)}
  .dot.bad{background:var(--err)}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.3}}
  .mask{position:fixed; inset:0; background:rgba(25,28,32,.32); display:flex;
    align-items:center; justify-content:center; z-index:60; animation:fadeIn 120ms var(--ease-std)}
  .dialog{width:min(420px, 86vw); background:var(--lowest); border-radius:18px; padding:20px 22px 16px;
    box-shadow:0 18px 48px rgba(25,28,32,.24)}
  .dialog h3{margin:0 0 8px; font:600 16px/22px var(--font)}
  .dialog p{margin:0 0 16px; color:var(--on-var); font-size:13px; line-height:20px}
  .dacts{display:flex; justify-content:flex-end; gap:10px}
  .dialog select{width:100%; height:38px; margin-bottom:10px; padding:0 10px; font:13px var(--font);
    color:var(--on); background:var(--lowest); border:1px solid var(--outline-var); border-radius:8px}
  .check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--on-var); cursor:pointer}
  .check input{width:16px; height:16px; accent-color:var(--primary)}
  /* 导出时的文件勾选清单 */
  .exlist{max-height:300px; overflow:auto; margin-top:4px}
  .exlist:empty{display:none}
  .exg{
    display:flex; align-items:center; gap:8px; padding:7px 0 5px;
    font-size:11.5px; font-weight:600; color:var(--on-var);
    border-bottom:1px solid var(--outline); margin-bottom:2px;
  }
  .exg .n{flex:1 1 auto}
  .exg button{
    height:24px; padding:0 9px; font-size:11px; border-radius:12px;
    background:none; border:1px solid var(--outline-var); color:var(--on-var); cursor:pointer;
  }
  .exg button:hover{background:var(--high); color:var(--on)}
  .exrow{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12.5px; color:var(--on)}
  .exrow input{width:15px; height:15px; accent-color:var(--primary); flex:0 0 auto}
  .exrow .f{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .exrow .s{flex:0 0 auto; font-size:11px; color:var(--on-var)}

  /* 右下角「关闭游戏」 */
  .kill{
    position:fixed; right:22px; bottom:22px; height:44px; padding:0 18px; border-radius:22px;
    background:var(--err); color:#fff; border:none; font:500 13px var(--font);
    box-shadow:0 6px 20px rgba(186,26,26,.28); display:flex; align-items:center; gap:8px;
    opacity:0; transform:translateY(12px) scale(.94); pointer-events:none;
    transition:opacity .18s var(--ease-std), transform .22s var(--ease-std);
    z-index:40;
  }
  .kill.on{opacity:1; transform:none; pointer-events:auto}
  .kill:hover{background:#a31616}
  .kill .pulse{width:8px; height:8px; border-radius:50%; background:#fff; animation:pulse 1.2s infinite}

  /* 启动动画 */
  .boot{position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(243,243,250,.92); backdrop-filter:blur(6px)}
  .boot.on{display:flex; animation:fadeIn 160ms var(--ease-std)}
  .boot .box{display:flex; flex-direction:column; align-items:center; gap:18px}
  .boot .mark{
    width:76px; height:76px; border-radius:20px; background:linear-gradient(150deg,#4C6BA2,#37517F);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 30px rgba(55,81,127,.28);
    animation:bootIn .5s var(--ease-std) both;
  }
  .boot .mark svg{width:44px; height:44px}
  @keyframes bootIn{from{opacity:0; transform:translateY(10px) scale(.9)} to{opacity:1; transform:none}}
  .boot .txt{font:500 14px var(--font); color:var(--on-var); letter-spacing:.2px}
  .boot .bar{width:180px; height:3px; border-radius:2px; background:var(--cont); overflow:hidden}
  .boot .bar i{display:block; height:100%; width:40%; background:var(--primary); border-radius:2px;
    animation:bootBar 1.1s var(--ease-std) infinite}
  @keyframes bootBar{0%{transform:translateX(-100%)} 100%{transform:translateX(320%)}}
  .bootcancel{
    margin-top:16px; height:34px; padding:0 18px; border-radius:17px;
    background:none; border:1px solid var(--outline-var); color:var(--on-var);
    font:500 12.5px var(--font); cursor:pointer;
  }
  .bootcancel:hover:not(:disabled){background:var(--high); color:var(--on)}
  .bootcancel:disabled{opacity:.6; cursor:default}

  /* 崩溃窗口 */
  .crash{
    position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background:rgba(16,24,40,.42); padding:24px;
  }
  /* display:flex 会盖掉浏览器默认的 [hidden]{display:none}，必须显式关掉 */
  .crash[hidden]{display:none}
  .crash-box{
    width:min(720px, 100%); max-height:100%; display:flex; flex-direction:column; gap:10px;
    background:#fff; border-radius:16px; padding:20px;
    box-shadow:0 24px 60px rgba(16,24,40,.28);
  }
  .crash-box h3{margin:0; font:500 16px/24px var(--font); color:var(--on)}
  .crash-reason{
    margin:0; padding:10px 12px; border-radius:10px; background:#ffdad6;
    color:#8c1d18; font:400 13px/20px var(--font); word-break:break-word;
  }
  /* 「怎么办」用次级容器色，和红色的「为什么」区分开 */
  .crash-advice{
    margin:0; padding:10px 12px; border-radius:10px; background:var(--s-cont);
    color:var(--on-s-cont); font:400 13px/20px var(--font); word-break:break-word;
  }
  .crash-advice[hidden]{display:none}
  .crash-log{
    margin:0; flex:1 1 auto; min-height:120px; max-height:46vh; overflow:auto;
    background:var(--low); border-radius:10px; padding:12px;
    font:400 12px/18px ui-monospace, Consolas, monospace; color:var(--on);
    white-space:pre-wrap; word-break:break-all;
  }
  .crash-row{display:flex; gap:8px; justify-content:flex-end; flex:0 0 auto}
</style>

<div class="top">
  <button class="back" id="back">← 返回</button>
  <h1 id="title">版本详情</h1>
  <div class="chips" id="chips"></div>
</div>

<div class="tabs">
  <button class="tab on" data-pane="overview">概览</button>
  <button class="tab" data-pane="adv">高级选项</button>
  <button class="tab" data-pane="mods">模组</button>
  <button class="tab" data-pane="export">导出</button>
</div>

<!-- 概览 -->
<div class="pane on" id="pane-overview">
  <div class="card">
    <div class="row">
      <span class="k">版本名</span>
      <input type="text" id="vname" spellcheck="false">
      <button id="save">保存</button>
    </div>

    <div class="row"><span class="k">客户端</span><span class="v" id="vjar">—</span></div>
    <div class="row"><span class="k">Java</span><span class="v" id="vjava">—</span></div>
    <div class="row"><span class="k">发布时间</span><span class="v" id="vdate">—</span></div>
    <div class="row" id="loaderRow" hidden>
      <span class="k">模组加载器</span>
      <span class="v" id="loaderHint">原版，装进去的模组不会被加载</span>
      <button id="addLoader">装加载器</button>
    </div>
  </div>

  <div class="acts">
    <button class="primary" id="go">启动游戏</button>
    <span class="spacer"></span>
    <button id="fix">校验并修复</button>
    <button class="danger" id="del">删除版本</button>
  </div>

  <div class="dirs">
    <button id="dmods">模组文件夹</button>
    <button id="dsaves">存档文件夹</button>
    <button id="dres">资源包文件夹</button>
    <button id="dshader">光影文件夹</button>
    <button id="dver">版本目录</button>
  </div>
</div>

<!-- 高级选项 -->
<div class="pane" id="pane-adv">
  <div class="card">
    <div class="row" style="align-items:flex-start">
      <span class="k" style="padding-top:8px">Java 虚拟机参数</span>
      <textarea id="jvmArgs" placeholder="跟随全局设置"></textarea>
    </div>
    <div class="row">
      <span class="k">游戏参数</span>
      <input type="text" id="gameArgs" placeholder="跟随全局设置" spellcheck="false">
    </div>
    <div class="row">
      <span class="k">内存管理</span>
      <div class="memslider">
        <div class="rail">
          <div class="track"><i id="vmemfill"></i></div>
          <input type="range" id="vmem" min="512" max="65536" step="512" value="2048">
        </div>
        <span class="mono" id="vmemval">2 GB</span>
      </div>
      <span class="mono" id="vmemhint" style="flex:0 0 auto"></span>
    </div>
    <div class="row">
      <span class="k">启动前命令</span>
      <input type="text" id="preLaunch" placeholder="留空则不执行" spellcheck="false">
    </div>
    <div class="row">
      <span class="k">模组更新</span>
      <label class="check"><input type="checkbox" id="noModUpdate"> 禁止更新 Mod</label>
    </div>
  </div>
  <div class="acts">
    <button class="primary" id="advsave">保存设置</button>
    <button class="quiet" id="advreset">全部跟随全局</button>
  </div>
</div>

<!-- 模组 -->
<div class="pane" id="pane-mods">
  <div class="card">
    <div class="row">
      <span class="k">已装模组</span>
      <span class="v" id="mcount">正在读取…</span>
      <button class="primary" id="mopen">打开模组列表</button>
    </div>
    <div class="row">
      <span class="k">模组文件夹</span>
      <span class="v mono" id="mpath">—</span>
      <button id="mfolder">打开</button>
    </div>
  </div>
</div>

<!-- 导出 -->
<div class="pane" id="pane-export">
  <div class="card">
    <div class="row">
      <span class="k">包含内容</span>
      <label class="check"><input type="checkbox" id="exConfig" checked> 配置</label>
      <label class="check"><input type="checkbox" id="exOptions" checked> 游戏设置</label>
    </div>
    <div class="row">
      <span class="k">导出位置</span>
      <span class="v mono" id="expath">导出到 MC\exports</span>
    </div>
  </div>
  <div class="card">
    <div class="row">
      <span class="k">选择文件</span>
      <span class="v" id="expickhint">正在读取…</span>
    </div>
    <div class="exlist" id="exlist"></div>
  </div>
  <div class="acts">
    <button class="primary" id="exgo">导出整合包</button>
    <button class="quiet" id="exopen" disabled>打开所在文件夹</button>
  </div>
</div>

<div class="status"><span class="dot" id="dot"></span><span id="status">正在读取版本信息…</span></div>

<button class="kill" id="kill"><span class="pulse"></span>关闭游戏</button>

<div class="boot" id="boot">
  <div class="box">
    <div class="mark">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <path fill="#F4F7FF" d="M150 874 L150 150 L312 150 L512 468 L712 150 L874 150 L874 874 L712 874 L712 345 L512 663 L312 345 L312 874 Z"/>
      </svg>
    </div>
    <div class="txt" id="bootTxt">正在启动游戏…</div>
    <div class="bar"><i></i></div>
    <button class="bootcancel" id="bootCancel">取消启动</button>
  </div>
</div>

<!-- 崩溃窗口：原因 + 日志，和 PCL2 一样直接摆出来 -->
<div class="crash" id="crash" hidden>
  <div class="crash-box">
    <h3>游戏崩溃了</h3>
    <p class="crash-reason" id="crashReason"></p>
<p class="crash-advice" id="crashAdvice" hidden></p>
    <pre class="crash-log" id="crashLog"></pre>
    <div class="crash-row">
      <button id="crashOpen">打开日志文件夹</button>
      <button id="crashCopy">复制日志</button>
      <button class="primary" id="crashClose">关闭</button>
    </div>
  </div>
</div>

<script>
  const $ = s => document.querySelector(s);
  let name = "";
  let versionPath = "";
  let info = null;
  let busy = false;
  let exportPath = "";

  function log(msg, kind) {
    $("#status").textContent = msg || "";
    $("#dot").className = "dot" + (kind ? " " + kind : "");
  }

  function confirmBox(title, text, okText) {
    return new Promise(resolve => {
      const mask = document.createElement("div");
      mask.className = "mask";
      const box = document.createElement("div");
      box.className = "dialog";
      const h = document.createElement("h3");
      h.textContent = title;
      const p = document.createElement("p");
      p.textContent = text;
      const acts = document.createElement("div");
      acts.className = "dacts";
      const no = document.createElement("button");
      no.textContent = "取消";
      const yes = document.createElement("button");
      yes.className = "danger";
      yes.textContent = okText || "确定";
      const close = v => { mask.remove(); resolve(v); };
      no.onclick = () => close(false);
      yes.onclick = () => close(true);
      mask.onclick = e => { if (e.target === mask) close(false); };
      document.addEventListener("keydown", function esc(e) {
        if (e.key === "Escape") { document.removeEventListener("keydown", esc); close(false); }
      });
      acts.append(no, yes);
      box.append(h, p, acts);
      mask.append(box);
      document.body.append(mask);
      yes.focus();
    });
  }

  function mb(n) {
    if (!n) return "—";
    return (n / 1048576).toFixed(1) + " MB";
  }

  function query() {
    const raw = window.__MiyQuery || "";
    const m = /(?:^|&)name=([^&]*)/.exec(raw);
    if (!m) return "";
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }

  function fillChips(v) {
    const box = $("#chips");
    const out = [];
    if (v.mc && v.mc !== v.id) out.push(["Minecraft " + v.mc, false]);
    const loader = v.loader || "原版";
    out.push([loader === "原版" ? "正式版" : loader + (v.loaderVer ? " " + v.loaderVer : ""), loader !== "原版"]);
    if (v.java) out.push(["Java " + v.java, false]);
    if (v.ok === false) out.push([v.incomplete ? "未装完" : "缺少文件", "warn"]);
    box.replaceChildren(...out.map(([text, hl]) => {
      const s = document.createElement("span");
      s.className = "chipmini" + (hl === "warn" ? " warn" : hl ? " hl" : "");
      s.textContent = text;
      return s;
    }));
  }

  async function load() {
    log("正在读取版本信息…", "busy");
    const r = await miy.call("miy.mc.installed", {}, 20000);
    const list = (r && r.versions) || [];
    const root = (r && r.root) || "";
    info = list.find(v => v.id === name) || null;
    if (!info) {
      $("#title").textContent = name || "版本详情";
      log("该版本已不在列表中，可能已被删除。", "bad");
      $("#go").disabled = true;
      $("#del").disabled = true;
      $("#save").disabled = true;
      return;
    }
    $("#title").textContent = info.id;
    $("#vname").value = info.id;
    versionPath = root ? root + "\\versions\\" + info.id : "";
    $("#mpath").textContent = root ? root + "\\versions\\" + info.id + "\\mods" : "—";
    $("#vjar").textContent = info.jar ? mb(info.jar) : "缺少客户端文件";
    $("#vjava").textContent = info.java ? "Java " + info.java : "跟随默认";
    $("#vdate").textContent = info.released ? info.released.slice(0, 10) : "—";
    fillChips(info);
    // 原版版本里装模组是不会被加载的，给一个就地装加载器的入口。
    $("#loaderRow").hidden = (info.loader || "原版") !== "原版";
    $("#go").disabled = !info.runnable;
    log(info.ok === false ? "该版本尚未安装完成，可以点「补齐资源」补全。" : "可以启动、补齐资源、改名或删除。", info.ok === false ? "bad" : "on");
  }

  async function save() {
    const to = $("#vname").value.trim();
    if (!to || to === name) { log("版本名没有变化。"); return; }
    if (busy) return;
    busy = true;
    log("正在改名…", "busy");
    try {
      const r = await miy.call("miy.mc.rename", { from: name, to }, 30000);
      if (r && r.ok) {
        name = to;
        await load();
        log("已改名为 " + to + "。", "on");
      } else {
        log((r && r.error) || "改名失败，请确认游戏已关闭后重试。", "bad");
      }
    } catch (e) {
      log("改名失败，请稍后再试。", "bad");
    } finally {
      busy = false;
    }
  }

  // 原版版本就地装加载器：合并进同一个目录，模组和存档都不动。
  async function pickLoader() {
    const mc = info.mc || info.id;
    log("正在读取加载器版本…", "busy");
    let list = [];
    try {
      const r = await miy.call("miy.mc.loaders", { mc }, 60000);
      list = (r && r.loaders) || [];
    } catch (e) { /* 下面统一报错 */ }
    if (!list.length) {
      log("没查到可用的加载器，检查一下网络。", "bad");
      return;
    }

    const mask = document.createElement("div");
    mask.className = "mask";
    const dlg = document.createElement("div");
    dlg.className = "dialog";
    const h = document.createElement("h3");
    h.textContent = "安装模组加载器";
    const p = document.createElement("p");
    p.textContent = "装到「" + info.id + "」里，现有的模组和存档都会保留。";
    const ld = document.createElement("select");
    const ver = document.createElement("select");
    for (const l of list) {
      const o = document.createElement("option");
      o.value = l.id;
      o.textContent = l.name || l.id;
      ld.append(o);
    }
    const fillVer = () => {
      const one = list.find(x => x.id === ld.value);
      ver.replaceChildren(...((one && one.versions) || []).map(v => {
        const o = document.createElement("option");
        o.value = v.version;
        o.textContent = v.version + (v.stable ? "" : "（测试）");
        return o;
      }));
    };
    ld.onchange = fillVer;
    fillVer();
    const acts = document.createElement("div");
    acts.className = "dacts";
    const no = document.createElement("button");
    no.textContent = "取消";
    no.onclick = () => mask.remove();
    const yes = document.createElement("button");
    yes.className = "primary";
    yes.textContent = "安装";
    yes.onclick = async () => {
      yes.disabled = true;
      yes.textContent = "安装中…";
      try {
        const r = await miy.call("miy.mc.install", {
          id: mc, name: info.id, loader: ld.value, loaderVersion: ver.value,
        }, 3600000);
        if (r && r.ok) {
          mask.remove();
          await load();
          log(ld.value + " " + ver.value + " 已装好，模组现在会生效了。", "on");
        } else {
          yes.disabled = false;
          yes.textContent = "安装";
          log((r && r.error) || "加载器没装上。", "bad");
        }
      } catch (e) {
        yes.disabled = false;
        yes.textContent = "安装";
        log("加载器没装上。", "bad");
      }
    };
    acts.append(no, yes);
    dlg.append(h, p, ld, ver, acts);
    mask.append(dlg);
    mask.onclick = e => { if (e.target === mask) mask.remove(); };
    document.body.append(mask);
  }

  async function del() {
    if (busy) return;
    const ok = await confirmBox(
      "删除版本",
      "确定要删除「" + name + "」吗？这个版本的存档、模组和设置都会一起删掉，无法恢复。",
      "删除");
    if (!ok) return;
    busy = true;
    log("正在删除…", "busy");
    try {
      const r = await miy.call("miy.mc.remove", { name }, 30000);
      if (r && r.ok) {
        miy.goto("page:miy.mc/games");
        return;
      }
      log((r && r.error) || "删除失败，请确认游戏已关闭后重试。", "bad");
    } catch (e) {
      log("删除失败，请稍后再试。", "bad");
    } finally {
      busy = false;
    }
  }

  function boot(on, text) {
    $("#boot").classList.toggle("on", !!on);
    if (text) $("#bootTxt").textContent = text;
    if (!on) {
      const c = $("#bootCancel");
      c.disabled = false;
      c.textContent = "取消启动";
    }
  }

  // 启动要读清单、补资源、挑 Java，慢的时候十几秒：这期间得能反悔。
  $("#bootCancel").onclick = async () => {
    const b = $("#bootCancel");
    b.disabled = true;
    b.textContent = "正在取消…";
    try {
      await miy.call("miy.mc.launch.cancel", {}, 15000);
    } catch (e) {}
    boot(false);
    log("已取消启动。", "on");
  };

  async function launch() {
    if (busy) return;
    busy = true;
    $("#go").disabled = true;
    boot(true, "正在启动 " + (info && info.mc ? "Minecraft " + info.mc : name) + "…");
    log("正在启动…", "busy");
    try {
      let r = await miy.call("miy.mc.launch", { id: name }, 180000);
      if (r && r.ok === false && r.code === "incomplete") {
        boot(true, "正在补齐游戏文件…");
        log("缺少必要文件，正在自动补齐…", "busy");
        await miy.call("miy.mc.install", { id: name, name }, 3600000);
        await miy.call("miy.mc.assets", { id: name }, 3600000);
        r = await miy.call("miy.mc.launch", { id: name }, 180000);
      }
      if (r && r.ok) {
        log("游戏已启动。", "on");
        boot(false);
        pollRunning();
      } else if (r && r.code === "cancelled") {
        boot(false);
        log("已取消启动。", "on");
      } else {
        boot(false);
        log((r && r.error) || "启动失败，请稍后再试。", "bad");
      }
    } catch (e) {
      boot(false);
      log("启动失败，请稍后再试。", "bad");
    } finally {
      busy = false;
      $("#go").disabled = !(info && info.runnable);
    }
  }

  // ---- 运行中的游戏：右下角「关闭游戏」 ----
  let runningPid = 0;
  async function pollRunning() {
    try {
      const r = await miy.call("miy.mc.running", {}, 8000);
      runningPid = (r && r.pid) || 0;
    } catch (e) {
      runningPid = 0;
    }
    $("#kill").classList.toggle("on", !!runningPid);
  }
  $("#kill").onclick = async () => {
    if (!runningPid) return;
    const ok = await confirmBox("关闭游戏", "确定要关闭正在运行的游戏吗？未保存的进度会丢失。", "关闭游戏");
    if (!ok) return;
    try {
      await miy.call("miy.mc.kill", { pid: runningPid }, 15000);
      log("已请求关闭游戏。", "on");
    } catch (e) {
      log("关闭游戏失败，请稍后再试。", "bad");
    }
    setTimeout(pollRunning, 800);
  };

  $("#back").onclick = () => miy.goto("page:miy.mc/games");
  $("#save").onclick = save;
  $("#del").onclick = del;
  $("#addLoader").onclick = pickLoader;
  $("#go").onclick = launch;
  $("#fix").onclick = async () => {
    if (busy || !name) return;
    busy = true;
    const b = $("#fix");
    b.disabled = true;
    b.textContent = "校验中";
    log("正在按大小与哈希校验文件，缺的会自动补回来。", "busy");
    try {
      const r = await miy.call("miy.mc.repair", { name }, 3600000);
      const missing = (r && r.missing) || 0;
      const still = (r && r.still) || 0;
      if (!missing) {
        log("文件都完整，不需要修复。", "on");
      } else if (still) {
        log(`补回 ${missing - still} 个，还有 ${still} 个没下来，可以再试一次。`, "bad");
      } else {
        log(`已补回 ${missing} 个文件。`, "on");
      }
    } catch (e) {
      log("修复没有完成，请稍后再试。", "bad");
    } finally {
      busy = false;
      b.disabled = false;
      b.textContent = "校验并修复";
    }
  };
  let lastCrash = null;
  function showCrash(p) {
    lastCrash = p || {};
    $("#crashReason").textContent = (p && p.reason) || "游戏异常退出。";
    // 规则命中时后端会给一句「怎么办」；没命中就整行藏起来，不留空框。
    const advice = (p && p.advice) || "";
    $("#crashAdvice").textContent = advice;
    $("#crashAdvice").hidden = !advice;
    $("#crashLog").textContent = (p && p.log) || "没有读到游戏日志，可以打开日志文件夹查看。";
    $("#crash").hidden = false;
  }
  $("#crashClose").onclick = () => { $("#crash").hidden = true; };
  $("#crashOpen").onclick = () => {
    const dir = lastCrash && lastCrash.dir;
    if (dir) miy.call("miy.app.open", { path: dir + "\\logs" }).catch(() => {});
  };
  $("#crashCopy").onclick = () => {
    miy.call("miy.app.clipboard", { text: $("#crashLog").textContent || "" }).catch(() => {});
  };

  miy.onEvent(({ topic, payload }) => {
    if (topic === "mc.progress" && payload && busy) {
      const done = payload.done || 0;
      const total = payload.total || 0;
      if (total) log("正在下载 " + done + " / " + total, "busy");
    }
    if (topic === "mc.launch" || topic === "mc.launch.fail") {
      boot(false);
      pollRunning();
    }
    if (topic === "mc.crash") {
      boot(false);
      showCrash(payload);
      log("游戏崩溃了，原因见弹窗。", "bad");
      pollRunning();
    }
  });

  $("#vname").addEventListener("keydown", e => { if (e.key === "Enter") save(); });

  function folder(kind) {
    if (!name) return;
    miy.call("miy.mc.folder", { id: name, kind }, 15000)
      .then(r => { if (!r || r.ok === false) log("没能打开文件夹，可能已被删除或没有权限。", "bad"); })
      .catch(() => log("没能打开文件夹。", "bad"));
  }
  $("#dmods").onclick = () => folder("mods");
  $("#dsaves").onclick = () => folder("saves");
  $("#dres").onclick = () => folder("resourcepacks");
  $("#dshader").onclick = () => folder("shaderpacks");
  $("#dver").onclick = () => folder("version");
  $("#mfolder").onclick = () => folder("mods");

  // ---- 分区切换 ----
  document.querySelectorAll(".tab").forEach(t => {
    t.onclick = () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
      document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + t.dataset.pane));
      if (t.dataset.pane === "adv") loadAdv();
      if (t.dataset.pane === "mods") loadModCount();
      if (t.dataset.pane === "export") loadExportList();
    };
  });

  // ---- 高级选项 ----
  let memDefault = 2048;
  let memTotal = 0;
  let memTouched = false;
  function paintMem() {
    const el = $("#vmem");
    const n = Number(el.value) || 0;
    $("#vmemval").textContent = n >= 1024 ? (n / 1024).toFixed(n % 1024 ? 1 : 0) + " GB" : n + " MB";
    const lo = Number(el.min), hi = Number(el.max);
    const ratio = hi > lo ? Math.min(1, Math.max(0, (n - lo) / (hi - lo))) : 0;
    const rail = el.parentElement;
    const w = rail ? rail.clientWidth : 0;
    const fill = $("#vmemfill");
    if (fill) fill.style.width = (8 + ratio * Math.max(0, w - 16)).toFixed(1) + "px";
  }
  async function loadMemCap() {
    try {
      const r = await miy.call("miy.app.info", {}, 8000);
      const total = r && r.memory && r.memory.total;
      if (!total) return;
      memTotal = total;
      const el = $("#vmem");
      const cap = Math.floor(total / 512) * 512;
      if (cap >= 1024) {
        el.max = String(cap);
        if (Number(el.value) > cap) el.value = String(cap);
        paintMem();
      }
      $("#vmemhint").textContent = "本机 " + (total / 1024).toFixed(0) + " GB";
    } catch (e) { /* 忽略 */ }
  }
  $("#vmem").addEventListener("pointerdown", () => { memTouched = true; });
  $("#vmem").addEventListener("keydown", () => { memTouched = true; });
  $("#vmem").addEventListener("input", paintMem);

  async function loadAdv() {
    if (!name) return;
    try {
      const r = await miy.call("miy.mc.vsettings", { id: name }, 12000);
      $("#jvmArgs").value = (r && r.jvmArgs) || "";
      $("#gameArgs").value = (r && r.gameArgs) || "";
      $("#preLaunch").value = (r && r.preLaunch) || "";
      $("#noModUpdate").checked = !!(r && r.noModUpdate);
      const mem = (r && r.memory) || 0;
      const el = $("#vmem");
      el.value = String(mem || 2048);
      paintMem();
    } catch (e) { /* 忽略 */ }
  }
  $("#advsave").onclick = async () => {
    if (!name) return;
    const mem = memTouched ? (parseInt($("#vmem").value, 10) || 0) : null;
    const set = {
      jvmArgs: $("#jvmArgs").value.trim(),
      gameArgs: $("#gameArgs").value.trim(),
      preLaunch: $("#preLaunch").value.trim(),
      noModUpdate: $("#noModUpdate").checked,
    };
    if (mem !== null) set.memory = mem;
    try {
      await miy.call("miy.mc.vsettings", { id: name, set }, 12000);
      log("这个版本的设置已保存。", "on");
      loadAdv();
    } catch (e) {
      log("保存设置失败，请稍后再试。", "bad");
    }
  };
  $("#advreset").onclick = async () => {
    if (!name) return;
    try {
      await miy.call("miy.mc.vsettings", {
        id: name,
        set: { memory: 0, jvmArgs: "", gameArgs: "", preLaunch: "", noModUpdate: false },
      }, 12000);
      memTouched = false;
      log("已全部改回跟随全局设置。", "on");
      loadAdv();
    } catch (e) {
      log("保存设置失败，请稍后再试。", "bad");
    }
  };

  // ---- 模组 ----
  async function loadModCount() {
    if (!name) return;
    try {
      const r = await miy.call("miy.mc.modfiles", { id: name }, 15000);
      const n = ((r && r.items) || []).length;
      $("#mcount").textContent = n ? n + " 个" : "还没有装模组";
    } catch (e) {
      $("#mcount").textContent = "—";
    }
  }
  $("#mopen").onclick = () => {
    if (!name) return;
    miy.goto("page:miy.mc/modlist?name=" + encodeURIComponent(name));
  };

  // ---- 导出 ----
  // 和 PCL2 一样：导出前能勾选具体带哪些模组 / 资源包 / 光影，
  // 而不是只有「模组」一个总开关。
  let exData = null;

  function exSize(n) {
    if (!n) return "";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }

  function exGroup(title, kind, items) {
    const frag = document.createDocumentFragment();
    const head = document.createElement("div");
    head.className = "exg";
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = title + "（" + items.length + "）";
    const all = document.createElement("button");
    all.type = "button";
    // 默认全部勾上，所以按钮一开始就该是「全不选」——以前写死「全选」，
    // 点一下反而把已经勾上的全取消了。
    all.textContent = items.length ? "全不选" : "全选";
    all.disabled = !items.length;
    all.onclick = () => {
      const boxes = [...document.querySelectorAll('#exlist input[data-kind="' + kind + '"]')];
      const on = boxes.some(b => !b.checked);
      boxes.forEach(b => { b.checked = on; });
      all.textContent = on ? "全不选" : "全选";
    };
    head.append(n, all);
    frag.append(head);
    if (!items.length) {
      const row = document.createElement("div");
      row.className = "exrow";
      const f = document.createElement("span");
      f.className = "f";
      f.style.color = "var(--on-var)";
      f.textContent = "（空）";
      row.append(f);
      frag.append(row);
      return frag;
    }
    for (const it of items) {
      const row = document.createElement("label");
      row.className = "exrow";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      cb.dataset.kind = kind;
      cb.dataset.file = it.file;
      const f = document.createElement("span");
      f.className = "f";
      f.textContent = it.file;
      f.title = it.file;
      const s = document.createElement("span");
      s.className = "s";
      s.textContent = exSize(it.size);
      row.append(cb, f, s);
      frag.append(row);
    }
    return frag;
  }

  function renderExportList() {
    const box = $("#exlist");
    box.replaceChildren();
    if (!exData) { $("#expickhint").textContent = "读取失败"; return; }
    // 四组都画出来：没有内容也显示「（空）」，用户才知道是没东西可导，
    // 而不是以为这里只支持模组。
    const groups = [
      ["模组", "mods", exData.mods || []],
      ["资源包", "resourcepacks", exData.resourcepacks || []],
      ["光影", "shaderpacks", exData.shaderpacks || []],
      ["存档", "saves", exData.saves || []],
    ];
    const total = groups.reduce((a, g) => a + g[2].length, 0);
    $("#expickhint").textContent = total
      ? "共 " + total + " 项，取消勾选即可排除。"
      : "这个版本还没有可导出的模组、资源包、光影或存档。";
    const frag = document.createDocumentFragment();
    for (const [title, kind, items] of groups) frag.append(exGroup(title, kind, items));
    box.append(frag);
  }

  async function loadExportList() {
    if (!name) return;
    if (exData) { renderExportList(); return; }
    try {
      exData = await miy.call("miy.mc.export.list", { id: name }, 20000);
      renderExportList();
    } catch (e) {
      $("#expickhint").textContent = "读取失败，导出时将包含全部文件。";
    }
  }

  function exPick(kind) {
    return [...document.querySelectorAll('#exlist input[data-kind="' + kind + '"]:checked')]
      .map(i => i.dataset.file);
  }

  $("#exgo").onclick = async () => {
    if (!name || busy) return;
    busy = true;
    const b = $("#exgo");
    b.disabled = true;
    b.textContent = "正在导出…";
    log("正在打包整合包…", "busy");
    try {
      const req = {
        id: name,
        config: $("#exConfig").checked,
        options: $("#exOptions").checked,
      };
      // 清单没读到时不要传空数组（那等于「一个都不导」），交给后端全导。
      if (exData) {
        req.mods = exPick("mods");
        req.resourcepacks = exPick("resourcepacks");
        req.shaderpacks = exPick("shaderpacks");
        req.saves = exPick("saves");
      }
      const r = await miy.call("miy.mc.export", req, 600000);
      if (r && r.ok) {
        exportPath = r.path || "";
        $("#expath").textContent = exportPath || "已导出";
        $("#exopen").disabled = !exportPath;
        log("已导出 " + (r.files || 0) + " 个文件（" + (r.mods || 0) + " 个模组）。", "on");
      } else {
        log((r && r.error) || "导出失败，请稍后再试。", "bad");
      }
    } catch (e) {
      log("导出失败，请稍后再试。", "bad");
    } finally {
      busy = false;
      b.disabled = false;
      b.textContent = "导出整合包";
    }
  };
  $("#exopen").onclick = () => {
    if (!exportPath) return;
    miy.call("miy.app.open", { path: exportPath }, 8000).catch(() => {});
  };

  // 支持 ?tab=adv|mods|export 直接打开某个分区（截图与外部跳转用）。
  function openTab(id) {
    const t = document.querySelector('.tab[data-pane="' + id + '"]');
    if (t) t.click();
  }
  const tabQ = /(?:^|&)tab=([^&]*)/.exec(window.__MiyQuery || "");
  if (tabQ) setTimeout(() => openTab(tabQ[1]), 60);

  name = query();
  if (!name) log("没有指定版本。", "bad");
  else {
    window.addEventListener("resize", paintMem);
    loadMemCap();
    load().then(loadModCount).catch(() => log("读取版本信息失败。", "bad"));
    pollRunning();
    setInterval(pollRunning, 2500);
  }
</script>
