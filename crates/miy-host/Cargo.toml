[package]
name = "miy-host"
description = "MIYLauncher 宿主：单 exe，一切皆插件"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "MIYLauncher"
path = "src/main.rs"

[dependencies]
miy-abi = { workspace = true, features = ["manifest"] }
# 内嵌的核心插件：静态链接进 exe，用户只下一个 MIYLauncher.exe 就能跑。
miy-mc = { workspace = true }
serde_json = "1"
flate2 = { workspace = true }
webview2-com = "0.38"
# `#[implement]` 生成的代码引用 `::windows_core::…`，得让它能按名字找到。
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_Networking_WinHttp",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_Threading",
            "Win32_System_DataExchange",
            "Win32_System_Ole",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"
flate2 = { workspace = true }
